<meta charset="utf-8">

<title>Change Job Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@500;700&family=Prompt:wght@400;500;600&family=Noto+Sans+Khmer:wght@400;700&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE warm, playful campaign poster from HR: a little care, short lines, friendly faces
   IDEA the MyThaiWah NEXT campaign card (her "A little care goes a long way" poster) that hands you a boarding pass for someone's move
   PICTURE two colleagues chatting at a desk; numbered move cards with characters and speech bubbles; the live pass
   COLOUR sky #EAF6FD ground, navy #1B2466 type, blue #1E9BE0 brush and wave, butter #FFE27A labels, red #EE3D55 call to action
   TYPE Mitr 700 display (rounded, Thai + Latin), Prompt text; Noto Sans Khmer / SC for KM, ZH
   LAYOUT logo + languages; headline with brush over the chat scene; five move cards; the pass + tip + red button; wave; then handover, rules, moments, help */
:root{color-scheme:light dark;--bg:light-dark(#EAF6FD,#0C1336);--bg2:light-dark(#FFFFFF,#111A45);--ink:light-dark(#1B2466,#EEF6FF);--soft:light-dark(#4A5585,#B4C1E6);--card:light-dark(#FFFFFF,#18224F);--line:light-dark(#D5E6F5,#2B3770);--navy:#1B2466;--blue:#1E9BE0;--butter:#FFE27A;--red:#EE3D55;--shadow:light-dark(rgba(27,36,102,.12),rgba(0,0,0,.35))}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.55 'Prompt',system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.disp{font-family:'Mitr','Prompt',sans-serif;font-weight:700}
html[lang=km] body{font-family:'Noto Sans Khmer','Prompt',sans-serif;line-height:1.75}
html[lang=km] :is(h1,h2,h3,.disp,.lab,.num,.cta){font-family:'Noto Sans Khmer','Mitr',sans-serif}
html[lang=zh] body{font-family:'Noto Sans SC','Prompt',sans-serif}
html[lang=zh] :is(h1,h2,h3,.disp,.lab,.cta){font-family:'Noto Sans SC','Mitr',sans-serif;font-weight:900}
.band{padding:clamp(28px,4vw,64px) max(5vw,16px)}
.in{max-width:1200px;margin:0 auto}
/* hero */
.hero{position:relative;padding-bottom:0;background:radial-gradient(60% 70% at 12% 30%,light-dark(#FFFFFF,#16205A) 0,transparent 70%),radial-gradient(40% 50% at 90% 10%,light-dark(#D6EEFB,#142060) 0,transparent 70%),var(--bg)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.logo{background:#fff;border-radius:14px;padding:6px 10px;display:inline-flex;box-shadow:0 4px 14px var(--shadow)}
.logo img{height:48px;width:auto;display:block}
.langs{display:flex;gap:4px;background:var(--card);border-radius:999px;padding:4px;box-shadow:0 4px 14px var(--shadow)}
.lang{min-height:40px;min-width:48px;border:0;border-radius:999px;background:transparent;color:var(--ink);font:600 15px/1 'Prompt','Noto Sans Khmer','Noto Sans SC',sans-serif;cursor:pointer;padding:0 12px}
.lang[aria-pressed=true]{background:var(--navy);color:#fff}
.top{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(12px,3vw,40px);align-items:center;margin-top:18px}
.scene{position:relative}
.scene svg{width:100%;height:auto;display:block}
.dood{position:absolute;width:52px;height:52px}
.dood svg{width:100%;height:100%}
.head{text-align:center;position:relative}
h1{margin:0;font-size:clamp(36px,5.4vw,64px);line-height:1.05;text-transform:uppercase;color:var(--ink);text-wrap:balance}
.brushline{display:inline-block;position:relative;padding:.12em .5em .2em;margin-top:.1em;color:#fff}
.brushline svg{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.brushline span{position:relative;z-index:1}
.pill{display:inline-block;margin:22px 0 10px;background:var(--navy);color:#fff;border-radius:999px;padding:10px 26px;font-weight:500;font-size:clamp(16px,1.8vw,19px)}
.heart{right:2%;top:-8%}.spark1{left:2%;top:-6%}.swirl{right:-2%;bottom:8%;width:90px}
/* move cards */
.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px;margin-top:26px;position:relative;z-index:2}
.card{appearance:none;border:3px solid transparent;text-align:left;background:var(--card);color:var(--ink);border-radius:22px;padding:14px 14px 0;box-shadow:0 8px 22px var(--shadow);cursor:pointer;display:flex;flex-direction:column;gap:8px;font:inherit;overflow:hidden;transition:transform .2s}
.card:hover{transform:translateY(-4px)}
.card[aria-pressed=true]{border-color:var(--blue);transform:translateY(-6px)}
.card:focus-visible,.lang:focus-visible,a:focus-visible{outline:3px solid var(--red);outline-offset:3px}
.chead{display:flex;align-items:center;gap:8px}
.num{flex:none;width:44px;height:44px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font:italic 700 19px/1 'Mitr',sans-serif}
.lab{background:var(--butter);color:#1B2466;border-radius:999px;padding:6px 12px;font:700 16px/1.25 'Mitr',sans-serif}
.cline{margin:0;font-size:15px;line-height:1.4;color:var(--soft);min-height:2.8em}
.art{position:relative;height:130px;margin:0 -14px;background:linear-gradient(transparent,light-dark(#EEF7FD,#1C2758))}
.art .pp{position:absolute;bottom:0;left:6%;width:122px;height:122px}
.art .bb{position:absolute;top:8px;right:8%;width:66px;height:59px;filter:drop-shadow(0 3px 6px var(--shadow))}
.art svg{width:100%;height:100%;display:block}
/* pass */
.passrow{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin-top:26px}
.pass{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);background:var(--card);border-radius:26px;box-shadow:0 10px 28px var(--shadow);position:relative}
.pmain{padding:clamp(20px,3vw,32px);display:grid;gap:16px}
.pt{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tag{background:var(--navy);color:#fff;border-radius:999px;padding:5px 14px;font:700 14px/1.3 'Mitr',sans-serif}
.lbl{font-size:14px;color:var(--soft);margin:0}
.val{font:700 19px/1.3 'Mitr','Prompt',sans-serif;margin:2px 0 0}
html[lang=km] .val{font-family:'Noto Sans Khmer',sans-serif}html[lang=zh] .val{font-family:'Noto Sans SC',sans-serif}
.route{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:center}
.route .to{text-align:right}
.fly{width:clamp(56px,9vw,110px);height:22px}
.tpl{background:light-dark(#EAF6FD,#1E2A62);border-radius:18px;padding:14px 18px}
.tpl .val{font-size:clamp(21px,2.6vw,28px);color:var(--ink)}
.tpl .sub{margin:4px 0 0;color:var(--soft);font-size:15.5px}
.stub{border-left:3px dashed var(--line);padding:clamp(20px,3vw,32px);display:flex;flex-direction:column;gap:12px;position:relative}
.stub::before,.stub::after{content:"";position:absolute;left:-17px;width:32px;height:32px;border-radius:50%;background:var(--bg)}
.stub::before{top:-17px}.stub::after{bottom:-17px}
.stub h3{margin:0;font-size:20px}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.checks li{display:flex;gap:10px;align-items:flex-start;line-height:1.4}
.tick{flex:none;width:26px;height:26px;border-radius:50%;background:#2BB673;display:grid;place-items:center;margin-top:1px}
.sample{font-size:13.5px;color:var(--soft);margin:4px 4px 0}
.actions{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}
.tip{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:22px;padding:14px 20px;box-shadow:0 6px 18px var(--shadow);font-weight:500}
.tip svg{width:52px;height:46px;flex:none}
.cta{display:inline-flex;align-items:center;gap:10px;min-height:56px;padding:12px 30px;border-radius:999px;background:linear-gradient(180deg,#FF5A6E,#E2304A);color:#fff;text-decoration:none;font:700 clamp(17px,2vw,21px)/1.2 'Mitr',sans-serif;text-transform:uppercase;box-shadow:0 6px 0 #B71F37,0 12px 24px rgba(226,48,74,.3);white-space:nowrap}
.cta:hover{filter:brightness(1.05)}
.wave{display:block;width:100%;height:clamp(60px,8vw,110px);margin-top:28px}
#wave{margin-inline:calc(-1 * max(5vw,16px))}
.dood{color:var(--ink)}
/* sections */
h2{font-size:clamp(30px,3.8vw,44px);line-height:1.08;margin:0 0 6px;text-wrap:balance}
.lede{margin:0 0 26px;color:var(--soft);max-width:60ch}
.white{background:var(--bg2)}
.navyband{background:var(--navy);color:#fff}.navyband .lede{color:#CFE6F7}
.ho{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:clamp(20px,4vw,56px);align-items:center}
.duo{display:flex;justify-content:center;gap:6%;align-items:flex-end;position:relative}
.duo figure{margin:0;text-align:center;width:42%}
.duo svg{width:100%;height:auto;display:block}
.duo figcaption{font:700 18px/1.2 'Mitr',sans-serif;margin-top:6px}
.duo small{display:block;font:400 14px/1.3 'Prompt',sans-serif;color:#CFE6F7}
.lanes{display:grid;gap:10px;margin-top:20px;position:relative;padding-bottom:30px}
.lane{height:22px;border-radius:999px;position:relative}
.lane i{position:absolute;top:0;bottom:0;border-radius:999px}
.tog{position:absolute;top:-6px;bottom:24px;left:45%;width:30%;border:2px dashed var(--butter);border-radius:10px}
.tog span{position:absolute;left:50%;bottom:-28px;transform:translateX(-50%);white-space:nowrap;color:var(--butter);font:700 14px/1.2 'Mitr',sans-serif}
.steps{display:grid;gap:14px}
.step{display:flex;gap:14px;align-items:flex-start;background:#fff;color:#1B2466;border-radius:20px;padding:14px 18px}
.step .num{background:var(--blue)}
.step .lab{display:inline-block;margin-bottom:6px}
.step p{margin:0}
.step code{font:600 15px/1.5 'Prompt',sans-serif;background:#EAF6FD;padding:1px 6px;border-radius:6px;overflow-wrap:anywhere}
.oops{margin:16px 0 0;padding:12px 16px;border-radius:16px;background:rgba(255,255,255,.1);border:2px solid var(--butter)}
.oops b{color:var(--butter)}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.tile{background:var(--card);border-radius:22px;box-shadow:0 8px 22px var(--shadow);padding:18px 18px 0;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.tile h3{margin:0;font-size:21px;line-height:1.25}
.tile p{margin:0;color:var(--soft)}
.tile .art{height:120px;margin-top:auto}
.vids{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.vid{margin:0;background:var(--card);border-radius:24px;box-shadow:0 8px 22px var(--shadow);overflow:hidden}
.yt{position:relative;display:block;aspect-ratio:16/9;background:#1B2466;overflow:hidden;color:#fff;text-decoration:none}.yt img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .3s}.yt[href]:hover img{transform:scale(1.03)}.yt[aria-disabled]{cursor:default}.playov{position:absolute;left:16px;bottom:16px;display:flex;align-items:center;gap:10px;background:rgba(27,36,102,.9);border-radius:999px;padding:6px 18px 6px 6px;font:600 16px/1.2 Mitr,Prompt,"Noto Sans Khmer","Noto Sans SC",sans-serif}.playov svg{width:38px;height:38px;flex:none}.more{gap:24px;flex-wrap:wrap;align-items:center}.deck{white-space:normal}.deck[hidden]{display:none}
.vid figcaption{padding:14px 20px 18px}.vid b{display:block;font:700 20px/1.3 'Mitr','Prompt',sans-serif}.vid small{color:var(--soft);font-size:15px}
.more{display:flex;justify-content:center;margin-top:26px}
.go{flex:none;min-height:40px;display:inline-grid;place-items:center;border-radius:999px;background:var(--navy);color:#fff;font:600 14px/1 'Prompt',sans-serif;padding:0 18px}
.links{display:grid;gap:12px}
.link{color:var(--ink);text-decoration:none;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-radius:20px;background:var(--card);box-shadow:0 6px 18px var(--shadow)}
.link>div{flex:1}.link h3{margin:0;font-size:18px}.link small{color:var(--soft)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills a{min-width:46px;min-height:40px;display:inline-grid;place-items:center;border-radius:999px;background:light-dark(#EAF6FD,#24306A);color:var(--ink);text-decoration:none;font:600 14px/1 'Prompt',sans-serif;padding:0 12px}
.pills a:hover{background:var(--navy);color:#fff}
.hris{display:flex;gap:16px;align-items:center;margin-top:8px}
.hris .pp{width:110px;height:110px;flex:none}
.hris b{font:700 clamp(24px,3vw,32px)/1.15 'Mitr',sans-serif;display:block}
footer{background:var(--navy);color:#CFE6F7;font-size:14px;padding:18px max(5vw,16px) 26px}
@media(max-width:1020px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:820px){.top,.ho,.vids{grid-template-columns:minmax(0,1fr)}.scene{max-width:440px;margin:0 auto}.pass{grid-template-columns:minmax(0,1fr)}.stub{border-left:0;border-top:3px dashed var(--line)}.stub::before{left:-17px;top:-17px}.stub::after{left:auto;right:-17px;top:-17px;bottom:auto}.three{grid-template-columns:minmax(0,1fr)}.actions{grid-template-columns:minmax(0,1fr)}.cta{justify-self:start;white-space:normal}}
@media(max-width:600px){.top{display:flex;flex-direction:column-reverse}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.art .pp{width:100px;height:100px}.art{height:108px}.route{grid-template-columns:minmax(0,1fr)}.route .to{text-align:left}.fly{transform:rotate(90deg);margin:0 auto}.dood{display:none}}
.four{grid-template-columns:repeat(4,minmax(0,1fr))}.note{margin:22px 0 0;align-items:flex-start;line-height:1.5}.note b{color:var(--red)}@media(max-width:1020px){.three.four{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.three.four{grid-template-columns:minmax(0,1fr)}}
@media(prefers-reduced-motion:no-preference){.pass.swap{animation:issue .35s ease-out}@keyframes issue{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}}
@media(prefers-reduced-motion:reduce){.card,.card:hover{transition:none;transform:none}}
</style>
</head>

<section class="band hero">
